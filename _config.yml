title: MauricioStradaPhotography.com
description: >
  Fotógrafo profesional de bodas, comuniones, books, estudio, reportajes,
  fotografía erótica, publicidad, de producto y alimentación.
url: https://mauriciostradaphotography.com
email: mauriciostradaphotography@gmail.com
lang: es
default_lang: es
languages:
  - es
  - de
  - en
  - fr

phone:
  es: "+34 643 85 18 84"
  ch: "+41 779448470"

# Galerías masonry: nº de columnas y breakpoints (px). Configurable.
gallery:
  columns_desktop: 3
  columns_tablet: 2
  columns_mobile: 1
  breakpoint_tablet: 1000
  breakpoint_mobile: 600

plugins:
  - jekyll-multiple-languages-plugin

exclude_from_localization:
  - assets

sass:
  style: compressed
  sourcemap: never

timezone: Europe/Zurich

markdown: kramdown

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - scripts/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - assets/images/visitas-source/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: es

  - scope:
      path: "galerias"
      type: pages
    values:
      layout: gallery
      body_class: page-gallery
      scripts:
        - gallery-masonry
        - gallery

  - scope:
      path: "galerias/videos-externos"
      type: pages
    values:
      scripts:
        - lazy-images
        - video-gallery
