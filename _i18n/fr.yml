  about:
    title: À propos de Mauricio
    description: Biographie de Mauricio Strada, photographe de mariage basé à Berne, Suisse.
    headline: Je suis Mauricio
    photo_alt: Mauricio Strada — photographe professionnel
    lead: photographe de mariage basé en Suisse
    paragraphs:
      - Depuis plus de 11 ans, je capture des moments significatifs dans la vie des personnes, toujours avec une approche calme, organisée et naturelle.
      - Je crois qu'une grande photographie de mariage ne se résume pas à de belles images, mais repose sur la confiance, la planification et la connexion émotionnelle.
      - Chaque couple est différent. C'est pourquoi je prends le temps de comprendre qui vous êtes, ce qui compte pour vous et comment vous souhaitez vivre votre jour de mariage.
      - "Mon objectif est simple : vous aider à profiter de la journée sans stress, tout en la documentant de manière authentique et intemporelle."
      - Je suis né en Colombie et j'ai déménagé en Europe en 2001.
      - J'ai étudié la photographie artistique aux Canaries, puis j'ai travaillé comme photographe indépendant à Madrid, en collaboration avec des médias et des artistes internationaux.
      - Aujourd'hui, je vis à Berne et je travaille en Suisse et dans toute l'Europe.
      - Je travaille avec des couples qui valorisent les moments naturels, le récit émotionnel et un mariage bien planifié.
      - Ce serait un honneur de documenter votre histoire et de créer des images que vous revivrez avec la même émotion, même de nombreuses années plus tard.
    extra_before_link: Vous pouvez voir comment nos projets prennent forme dans les galeries et dans les coulisses de certains travaux
    extra_link_text: via ce lien
    extra_after_link: .
    extra_contact_before: N'hésitez pas non plus à nous écrire via
