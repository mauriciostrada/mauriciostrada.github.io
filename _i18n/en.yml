  about:
    title: About Mauricio
    description: Biography of Mauricio Strada, wedding photographer based in Bern, Switzerland.
    headline: I am Mauricio
    photo_alt: Mauricio Strada — professional photographer
    lead: wedding photographer based in Switzerland
    paragraphs:
      - For more than 11 years I have been capturing meaningful moments in people's lives, always with a calm, organised and natural approach.
      - I believe that great wedding photography is not just about beautiful images, but about trust, planning and emotional connection.
      - Every couple is different. That is why I take the time to understand who you are, what matters to you and how you want to experience your wedding day.
      - "My goal is simple: to help you enjoy the day without stress while I document it in an authentic and timeless way."
      - I was born in Colombia and moved to Europe in 2001.
      - I studied artistic photography in the Canary Islands and later worked as a freelance photographer in Madrid, collaborating with international media and artists.
      - Today I live in Bern and work in Switzerland and across Europe.
      - I work with couples who value natural moments, emotional storytelling and a well-planned wedding.
      - It would be an honour to document your story and create images you will relive with the same emotion, even many years later.
    extra_before_link: You can see how our projects come together in the galleries and in the behind-the-scenes videos of some of our work
