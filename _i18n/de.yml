  about:
    title: Über Mauricio
    description: Biografie von Mauricio Strada, Hochzeitsfotograf mit Sitz in Bern, Schweiz.
    headline: Ich bin Mauricio
    photo_alt: Mauricio Strada — professioneller Fotograf
    lead: Hochzeitsfotograf mit Sitz in der Schweiz
    paragraphs:
      - Seit mehr als 11 Jahren halte ich bedeutungsvolle Momente im Leben der Menschen fest — stets mit einem ruhigen, organisierten und natürlichen Ansatz.
      - Ich bin überzeugt, dass großartige Hochzeitsfotografie nicht nur schöne Bilder bedeutet, sondern Vertrauen, Planung und emotionale Verbindung.
      - Jedes Paar ist anders. Deshalb nehme ich mir die Zeit zu verstehen, wer Sie sind, was Ihnen wichtig ist und wie Sie Ihren Hochzeitstag erleben möchten.
      - "Mein Ziel ist einfach: Ihnen zu helfen, den Tag ohne Stress zu genießen, während ich ihn authentisch und zeitlos dokumentiere."
      - Ich wurde in Kolumbien geboren und bin 2001 nach Europa gezogen.
      - Ich studierte künstlerische Fotografie auf den Kanarischen Inseln und arbeitete anschließend als Freelance-Fotograf in Madrid, in Zusammenarbeit mit internationalen Medien und Künstlern.
      - Heute lebe ich in Bern und arbeite in der Schweiz und in ganz Europa.
      - Ich arbeite mit Paaren, die natürliche Momente, emotionale Erzählungen und eine gut geplante Hochzeit schätzen.
      - Es wäre mir eine Ehre, Ihre Geschichte zu dokumentieren und Bilder zu schaffen, die Sie auch viele Jahre später mit derselben Emotion wieder erleben.
    extra_before_link: Wie unsere Projekte entstehen, sehen Sie in den Galerien und in den Behind-the-Scenes-Videos einiger Arbeiten
    extra_link_text: unter diesem Link
    extra_after_link: .
