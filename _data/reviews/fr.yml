# Avis de Bodas.net (extraits et vérifiés à partir des captures de l'ancien site).
# Ordre : les plus récents en premier.

reviews:
  - author: "Laura Delgado Carriedo"
    date: "2019-09-07"
    wedding_date: "2019-09-07"
    rating: 5
    source: "Bodas.net"
    title: "Grand professionnel et belle personne"
    text: >
      C'est un grand professionnel qui réalise des photos incroyables. Il vous traite
      de manière particulière et vous met très à l'aise.

  - author: "Beatriz Santamaría Balsalobre"
    date: "2018-11-11"
    wedding_date: "2018-10-20"
    rating: 5
    source: "Bodas.net"
    title: "Photographe professionnel et proche"
    text: >
      Nous avons réservé un reportage de mariage couvrant la cérémonie, une séance de
      couple et quelques photos lors du cocktail. Tout a été génial : très proche, de
      très belles photos et il encourageait les invités à prendre des photos amusantes.
      Lors de la cérémonie, il coordonnait les personnes pour que tout se passe bien
      et trouvait des astuces pour animer le public à la sortie de l'église. Lors de la
      séance de couple, des photos magnifiques avec de très bonnes idées pour les poses,
      les lieux et le reste. Et lors du cocktail, où il n'avait que quelques photos à
      faire, il a été extrêmement agréable : il est resté bien plus longtemps, répondant
      à des demandes spéciales et nous prenant de très belles dernières photos à l'hôtel.
      Merci, Mauricio, pour ces photos d'une journée si importante.

  - author: "Tanii González"
    date: "2018-04-10"
    wedding_date: "2018-02-18"
    rating: 5
    source: "Bodas.net"
    title: "Excellent travail et très professionnel"
    text: >
      Je suis contente du travail réalisé par Mauricio. Il me semble une personne très
      professionnelle dans son métier et, surtout, le contact est excellent. Nous nous
      sommes sentis très à l'aise en travaillant avec lui. Amical : il vous aide pour
      les poses, vous donne des idées amusantes et les photos sont superbes ; et la vidéo,
      impressionnante.

  - author: "Laura López"
    date: "2018-03-07"
    wedding_date: "2018-02-24"
    rating: 5
    source: "Bodas.net"
    title: "Satisfaction"
    text: >
      Attentif et proche : il rend la séance amusante et fraîche. C'était sans aucun
      doute le bon choix de faire appel à lui, car nous conserverons de belles photos
      pour toujours. Je ne peux que parler de professionnalisme et de dévouement dans
      son travail.

  - author: "Susana Felipe Reyeros"
    date: "2017-10-21"
    wedding_date: "2017-10-21"
    rating: 5
    source: "Bodas.net"
    text: >
      Je ne peux que remercier pour le travail réalisé ; les mots pour le décrire seraient
      professionnalisme, calme (dont un couple a tant besoin ce jour-là), gentillesse et
      talent naturel. Il y a de nombreuses façons d'être artiste et tu l'es dans ton domaine.
      Nous n'avons pas les mots pour exprimer notre gratitude, et nous voulons transmettre,
      de la part de nos invités, leur gratitude également, car ton contact et ton travail
      n'ont pas seulement été exemplaires avec nous, mais tous les invités ont été
      enchantés par toi. Merci. Notre journée perdure dans le temps et pas seulement dans
      nos souvenirs grâce à ton travail.

  - author: "Enrique y Alejandro"
    date: "2017-10-22"
    wedding_date: "2017-10-19"
    rating: 5
    source: "Bodas.net"
    text: >
      Très professionnel : il vous laisse choisir mais vous conseille aussi. Il vous met
      très à l'aise et vous fait donner le meilleur de vous-même. Nous avons choisi les
      lieux et il les a rendus magiques. Les sourires sont venus naturellement et il a
      photographié l'amour.
    response: >
      Mille mercis, Enrique et Alejo. Je souhaite que l'amour continue de couler entre
      vous pour le reste de vos vies. Merci pour le contact que vous m'avez accordé et
      la facilité de travailler pour vous. Une étreinte.

  - author: "Enrique Fernández Marval"
    date: "2017-10-24"
    wedding_date: "2017-06-09"
    rating: 5
    source: "Bodas.net"
    text: >
      Excellent photographe ; je le recommande à 1000 %. Dès le moment où il a partagé
      et nous a fait découvrir son travail, sa façon de parler et de se présenter nous
      ont convaincus que c'était notre photographe. Le jour du mariage a été merveilleux :
      patience à chaque pose et les photos capturées de manière imprévue nous ont beaucoup
      séduits, car elles contiennent tous les détails de notre mariage que nous pensions
      ne pas pouvoir garder en mémoire tant ils passaient vite. Nos proches ont été
      enchantés par l'attention et la façon si particulière de capturer les photos. La
      qualité et le prix vont de pair ; je ne regrette pas d'avoir engagé Strada pour
      notre mariage. C'est une excellente personne, sur le plan professionnel et personnel,
      avec une qualité humaine incroyable. Encore une fois, recommandé à 100 %. Si je me
      fiancais à nouveau — que Dieu m'en garde —, je l'engagerais mille fois. Merci,
      Mauricio.

  - author: "Gabriela"
    date: "2017-09-26"
    wedding_date: "2017-09-23"
    rating: 5
    source: "Bodas.net"
    text: >
      Pour moi, l'une des choses qui comptaient le plus pour mon compagnon et moi, c'est
      que nos photos reflètent ce que nous avons ressenti lors de notre mariage, et c'est
      exactement ce qui s'est passé. Notre photographe, Mauricio Strada, dès la première
      minute nous a tenu informés et a été très patient, car nous ne savions pas quand
      notre horaire serait confirmé. À tout moment, attentif. Et le jour du mariage, très
      aimable, toujours prêt pour la meilleure prise. Sans aucun doute, recommandé cent
      pour cent.

  - author: "Lervis Marin"
    date: "2017-08-15"
    wedding_date: "2015-12-12"
    rating: 5
    source: "Bodas.net"
    text: >
      Ce fut merveilleux de compter sur le talent et le professionnalisme de Mauricio
      Strada pour notre mariage. Quelle que soit la distance qui nous séparait, le contact
      dès le premier moment a été incroyable : proche et créatif, et nous n'avons pas
      hésité un instant à faire appel à ses services. Même s'il était de l'autre côté du
      monde, cela en valait la peine. Nos souvenirs reflètent exactement ce que nous
      voulions. Le contact a été agréable ; la ponctualité et le savoir-être en tant que
      personne sont incroyables, et son talent ainsi que le résultat de notre album sont
      incroyables. Sans aucun doute, fortement recommandé. L'équilibre entre qualité et
      prix est incomparable.

  - author: "Patricia"
    date: "2016-06-16"
    wedding_date: "2016-04-29"
    rating: 5
    source: "Bodas.net"
    text: >
      Le mariage est quelque chose de très important pour toutes les familles et nous
      voulons que ce jour si spécial soit le plus parfait de tous. Mauricio Strada est
      un photographe exceptionnel qui a fait de ce jour le meilleur de tous, avec son
      charisme, son talent, sa responsabilité, son respect et son professionnalisme. À
      toutes les mariées qui consultent cette page, je conseille de choisir Mauricio Strada :
      vous aurez vos plus beaux souvenirs en de magnifiques photos.
