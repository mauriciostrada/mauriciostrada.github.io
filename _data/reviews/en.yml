# Reviews from Bodas.net (extracted and reviewed from previous site screenshots).
# Order: most recent first.

reviews:
  - author: "Laura Delgado Carriedo"
    date: "2019-09-07"
    wedding_date: "2019-09-07"
    rating: 5
    source: "Bodas.net"
    title: "Outstanding professional and person"
    text: >
      He is an outstanding professional who takes incredible photos. He treats you
      in a special way and makes you feel very comfortable.

  - author: "Beatriz Santamaría Balsalobre"
    date: "2018-11-11"
    wedding_date: "2018-10-20"
    rating: 5
    source: "Bodas.net"
    title: "Professional and approachable photographer"
    text: >
      We hired a wedding reportage covering the ceremony, a couples' session and
      a few photos during the cocktail reception. Everything was wonderful: very
      approachable, excellent photos and encouraging guests to take fun pictures.
      During the ceremony he coordinated people so everything went smoothly and
      found clever ways to encourage the crowd as we left the church. For the couples'
      session, stunning photos with great ideas for poses, locations and more.
      And during the cocktail, when he only needed to take a couple of photos, he
      was incredibly kind: he stayed much longer, accommodating special requests
      and taking some final beautiful photos at the hotel. Thank you, Mauricio,
      for those photos of such an important day.

  - author: "Tanii González"
    date: "2018-04-10"
    wedding_date: "2018-02-18"
    rating: 5
    source: "Bodas.net"
    title: "Excellent work and very professional"
    text: >
      I am happy with the work Mauricio did. I find him a very professional person
      in his work and, above all, his manner is excellent. We felt very comfortable
      working with him. Friendly: he helps you with poses, gives you fun ideas and
      the photos turn out beautifully; and the video is impressive.

  - author: "Laura López"
    date: "2018-03-07"
    wedding_date: "2018-02-24"
    rating: 5
    source: "Bodas.net"
    title: "Highly satisfied"
    text: >
      Attentive and approachable: he makes the session fun and fresh. Choosing him
      was definitely the right decision, because we will keep beautiful photos
      forever. I can only speak of professionalism and dedication in his work.

  - author: "Susana Felipe Reyeros"
    date: "2017-10-21"
    wedding_date: "2017-10-21"
    rating: 5
    source: "Bodas.net"
    text: >
      I can only thank him for the work he did; the words to describe it would be
      professionalism, calm (which a couple needs so much on that day), kindness
      and natural talent. There are many ways to be an artist and you are one in
      your field. We have no words to describe how grateful we feel, and we want
      to pass on, on behalf of our guests, their gratitude too, because your manner
      and work were not only exemplary with us, but all our guests were delighted
      with you. Thank you. Our day will endure in time and not only in our memories
      thanks to your work.

  - author: "Enrique y Alejandro"
    date: "2017-10-22"
    wedding_date: "2017-10-19"
    rating: 5
    source: "Bodas.net"
    text: >
      Very professional: he lets you choose but also advises you. He makes you feel
      very comfortable and brings out the best in you. We chose the locations and
      he made them magical. The smiles came naturally and he photographed the love.
    response: >
      Thank you so much, Enrique and Alejo. I wish that love continues to flow between
      you for the rest of your lives. Thank you for the way you treated me and for
      how easy you made it to work for you. A hug.

  - author: "Enrique Fernández Marval"
    date: "2017-10-24"
    wedding_date: "2017-06-09"
    rating: 5
    source: "Bodas.net"
    text: >
      Excellent photographer; I recommend him 1000%. From the moment he shared and
      introduced us to his work, his way of speaking and presenting himself convinced
      us that he was our photographer. The wedding day was wonderful: patience with
      every pose and the candid shots he captured delighted us greatly, as they include
      all the details of our wedding that we thought would not be remembered because
      they happened so quickly. Our family were delighted with his attention and the
      special way he captured the photos. Quality and price go hand in hand; I do not
      regret hiring Strada for our wedding. He is an excellent person, both professionally
      and personally, with incredible human qualities. Once again, recommended 100%.
      If I were to get engaged again — God forbid — I would hire him a thousand times
      over. Thank you, Mauricio.

  - author: "Gabriela"
    date: "2017-09-26"
    wedding_date: "2017-09-23"
    rating: 5
    source: "Bodas.net"
    text: >
      For me, one of the things that mattered most to my partner and me is that our
      photos reflect what we felt at our wedding, and that is exactly what happened.
      Our photographer, Mauricio Strada, from minute one kept us informed and was very
      patient, as we did not know when our time would be confirmed. At all times, attentive.
      And on the wedding day, very kind, always ready for the best shot. Without a doubt,
      recommended one hundred percent.

  - author: "Lervis Marin"
    date: "2017-08-15"
    wedding_date: "2015-12-12"
    rating: 5
    source: "Bodas.net"
    text: >
      It was wonderful to have Mauricio Strada's talent and professionalism at our wedding.
      Regardless of the distance between us, contact from the very first moment was
      incredible: approachable and creative, and we never hesitated to hire his services.
      Even though he was on the other side of the world, it was worth it. Our memories
      capture exactly what we wanted. His manner was pleasant; his punctuality and
      personal presence are incredible, and his talent and the result of our album
      are incredible. Without a doubt, highly recommended. The balance between quality
      and price is incomparable.

  - author: "Patricia"
    date: "2016-06-16"
    wedding_date: "2016-04-29"
    rating: 5
    source: "Bodas.net"
    text: >
      Marriage is something very important for every family and we want that special
      day to be the most perfect of all. Mauricio Strada is a special photographer who
      made that day the best of all, with his charisma, talent, responsibility, respect
      and professionalism. To all the brides viewing this page, I advise you to choose
      Mauricio Strada: you will have your best memories in beautiful photographs.
