# Bewertungen von Bodas.net (aus Screenshots der früheren Website extrahiert und überprüft).
# Reihenfolge: neueste zuerst.

reviews:
  - author: "Laura Delgado Carriedo"
    date: "2019-09-07"
    wedding_date: "2019-09-07"
    rating: 5
    source: "Bodas.net"
    title: "Großartiger Profi und Mensch"
    text: >
      Er ist ein großartiger Profi, der unglaubliche Fotos macht. Er behandelt einen
      besonders und sorgt dafür, dass man sich sehr wohlfühlt.

  - author: "Beatriz Santamaría Balsalobre"
    date: "2018-11-11"
    wedding_date: "2018-10-20"
    rating: 5
    source: "Bodas.net"
    title: "Professioneller und nahbarer Fotograf"
    text: >
      Wir haben einen Hochzeitsreportage gebucht, der die Zeremonie, ein Paarshooting
      und einige Fotos beim Cocktail abdeckte. Alles war großartig: sehr nahbar, sehr
      gute Fotos und er animierte die Gäste zu lustigen Aufnahmen. Bei der Zeremonie
      koordinierte er die Leute, damit alles gut lief, und fand geschickte Wege, das
      Publikum beim Verlassen der Kirche mit einzubeziehen. Beim Paarshooting wunderschöne
      Fotos mit sehr guten Ideen für Posen, Orte und mehr. Und beim Cocktail, wo er
      eigentlich nur ein paar Fotos machen sollte, war er unglaublich freundlich: Er
      blieb noch länger, erfüllte besondere Wünsche und machte uns noch einige schöne
      letzte Fotos im Hotel. Danke, Mauricio, für diese Fotos eines so wichtigen Tages.

  - author: "Tanii González"
    date: "2018-04-10"
    wedding_date: "2018-02-18"
    rating: 5
    source: "Bodas.net"
    title: "Ausgezeichnete Arbeit und sehr professionell"
    text: >
      Ich bin zufrieden mit der Arbeit von Mauricio. Er wirkt mir sehr professionell
      in seinem Beruf und vor allem ist der Umgang ausgezeichnet. Wir fühlten uns sehr
      wohl bei der Zusammenarbeit mit ihm. Freundlich: Er hilft bei Posen, gibt lustige
      Ideen und die Fotos werden großartig; und das Video ist beeindruckend.

  - author: "Laura López"
    date: "2018-03-07"
    wedding_date: "2018-02-24"
    rating: 5
    source: "Bodas.net"
    title: "Zufriedenheit"
    text: >
      Aufmerksam und nahbar: Er macht das Shooting unterhaltsam und frisch. Es war
      ohne Zweifel die richtige Wahl, ihn zu engagieren, denn wir werden schöne Fotos
      für immer behalten. Ich kann nur von Professionalität und Hingabe in seiner Arbeit
      sprechen.

  - author: "Susana Felipe Reyeros"
    date: "2017-10-21"
    wedding_date: "2017-10-21"
    rating: 5
    source: "Bodas.net"
    text: >
      Ich kann mich nur für die geleistete Arbeit bedanken; die Worte dafür wären
      Professionalität, Ruhe (die ein Paar an diesem Tag so sehr braucht), Freundlichkeit
      und natürliches Talent. Es gibt viele Wege, Künstler zu sein, und du bist es in
      deinem Bereich. Wir haben keine Worte, um unsere Dankbarkeit auszudrücken, und
      möchten im Namen unserer Gäste auch deren Dank weitergeben, denn dein Umgang und
      deine Arbeit waren nicht nur bei uns vorbildlich, sondern alle Gäste waren begeistert
      von dir. Danke. Unser Tag wird dank deiner Arbeit in der Zeit bestehen und nicht
      nur in unseren Erinnerungen.

  - author: "Enrique y Alejandro"
    date: "2017-10-22"
    wedding_date: "2017-10-19"
    rating: 5
    source: "Bodas.net"
    text: >
      Sehr professionell: Er lässt einen wählen, berät aber auch. Er sorgt dafür, dass
      man sich sehr wohl fühlt und holt das Beste aus einem heraus. Wir wählten die
      Orte und er machte sie magisch. Die Lächeln kamen natürlich und er fotografierte
      die Liebe.
    response: >
      Tausend Dank, Enrique und Alejo. Ich wünsche euch, dass die Liebe euch ein Leben
      lang begleitet. Danke für den Umgang mit mir und dafür, wie leicht ihr mir die
      Arbeit gemacht habt. Eine Umarmung.

  - author: "Enrique Fernández Marval"
    date: "2017-10-24"
    wedding_date: "2017-06-09"
    rating: 5
    source: "Bodas.net"
    text: >
      Ausgezeichneter Fotograf; ich empfehle ihn zu 1000 %. Vom Moment an, als er seine
      Arbeit mit uns teilte und vorstellte, überzeugten uns seine Art zu sprechen und
      sich zu präsentieren, dass er unser Fotograf war. Der Hochzeitstag war wunderbar:
      Geduld bei jeder Pose und die unerwartet eingefangenen Aufnahmen haben uns sehr
      begeistert, denn sie enthalten alle Details unserer Hochzeit, von denen wir dachten,
      sie würden wegen der Schnelligkeit nicht festgehalten. Unsere Familie war begeistert
      von seiner Aufmerksamkeit und der besonderen Art, die Fotos einzufangen. Qualität
      und Preis gehen Hand in Hand; ich bereue nicht, Strada für unsere Hochzeit engagiert
      zu haben. Er ist eine ausgezeichnete Person, beruflich und persönlich, mit unglaublicher
      menschlicher Qualität. Nochmals, 100 % empfohlen. Würde ich mich noch einmal verloben
      — Gott behüte —, würde ich ihn tausendmal wieder engagieren. Danke, Mauricio.

  - author: "Gabriela"
    date: "2017-09-26"
    wedding_date: "2017-09-23"
    rating: 5
    source: "Bodas.net"
    text: >
      Für mich war eines der wichtigsten Dinge für meinen Partner und mich, dass unsere
      Fotos widerspiegeln, was wir bei unserer Hochzeit empfunden haben, und genau das
      ist passiert. Unser Fotograf, Mauricio Strada, informierte uns von Minute eins an
      und war sehr geduldig, da wir nicht wussten, wann unsere Uhrzeit bestätigt würde.
      Jederzeit aufmerksam. Und am Hochzeitstag sehr freundlich, immer bereit für die
      beste Aufnahme. Ohne Zweifel, hundertprozentig empfohlen.

  - author: "Lervis Marin"
    date: "2017-08-15"
    wedding_date: "2015-12-12"
    rating: 5
    source: "Bodas.net"
    text: >
      Es war wunderbar, bei unserer Hochzeit das Talent und die Professionalität von
      Mauricio Strada zu haben. Unabhängig von der Entfernung war der Kontakt vom ersten
      Moment an unglaublich: nahbar und kreativ, und wir zögerten keinen Augenblick, seine
      Dienste in Anspruch zu nehmen. Obwohl er auf der anderen Seite der Welt war, hat
      es sich gelohnt. Unsere Erinnerungen zeigen genau das, was wir wollten. Der Umgang
      war angenehm; Pünktlichkeit und Auftreten als Person sind unglaublich, und sein
      Talent sowie das Ergebnis unseres Albums sind unglaublich. Ohne Zweifel, sehr
      empfehlenswert. Das Verhältnis zwischen Qualität und Preis ist unschlagbar.

  - author: "Patricia"
    date: "2016-06-16"
    wedding_date: "2016-04-29"
    rating: 5
    source: "Bodas.net"
    text: >
      Die Ehe ist für jede Familie etwas sehr Wichtiges und wir möchten, dass dieser
      besondere Tag der perfekteste aller ist. Mauricio Strada ist ein besonderer Fotograf,
      der diesen Tag mit seinem Charisma, Talent, Verantwortungsbewusstsein, Respekt und
      Professionalität zum besten aller machte. Allen Bräuten, die diese Seite sehen,
      rate ich, sich für Mauricio Strada zu entscheiden: Ihr werdet eure besten Erinnerungen
      in wunderschönen Fotos haben.
