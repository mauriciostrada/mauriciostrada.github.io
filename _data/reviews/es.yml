# Reseñas de Bodas.net (extraídas y revisadas desde las capturas del sitio anterior).
# Orden: más recientes primero.

reviews:
  - author: "Laura Delgado Carriedo"
    date: "2019-09-07"
    wedding_date: "2019-09-07"
    rating: 5
    source: "Bodas.net"
    title: "Gran profesional y persona"
    text: >
      Es un gran profesional que hace unas fotos increíbles. Te trata de manera especial
      y hace que te sientas muy cómodo.

  - author: "Beatriz Santamaría Balsalobre"
    date: "2018-11-11"
    wedding_date: "2018-10-20"
    rating: 5
    source: "Bodas.net"
    title: "Fotógrafo profesional y cercano"
    text: >
      Contratamos un reportaje de boda que cubría la ceremonia, un reportaje de novios y
      alguna foto en el cóctel. Todo fue genial: muy cercano, muy buenas fotos y animando
      a la gente para sacar fotos graciosas. En la ceremonia coordinaba a la gente para que
      todo fuese bien y buscándose las mañas para animar al público a la salida de la iglesia.
      En el reportaje de novios, fotos chulísimas con muy buenas ideas para las posiciones,
      lugares y demás. Y en el cóctel, que solo le correspondía hacer un par de fotos, fue
      superagradable: se quedó un buen rato más, atendiendo peticiones especiales y sacándonos
      unas últimas fotos en el hotel muy chulas. Gracias, Mauricio, por esas fotos de un día
      tan importante.

  - author: "Tanii González"
    date: "2018-04-10"
    wedding_date: "2018-02-18"
    rating: 5
    source: "Bodas.net"
    title: "Excelente trabajo y muy profesional"
    text: >
      Estoy contenta con el trabajo realizado por Mauricio. Me parece una persona muy
      profesional en su trabajo y, sobre todo, el trato es excelente. Nos sentimos muy
      cómodos al trabajar con él. Amigable: te ayuda a hacer las poses, te da ideas divertidas
      y quedan de lujo las fotos; y el vídeo, impresionante.

  - author: "Laura López"
    date: "2018-03-07"
    wedding_date: "2018-02-24"
    rating: 5
    source: "Bodas.net"
    title: "Satisfacción"
    text: >
      Detallista y cercano: hace que la sesión sea divertida y fresca. Un acierto sin duda
      contar con él, porque vamos a conservar unas lindas fotos para siempre. Solo puedo
      decir profesionalidad y dedicación en su trabajo.

  - author: "Susana Felipe Reyeros"
    date: "2017-10-21"
    wedding_date: "2017-10-21"
    rating: 5
    source: "Bodas.net"
    text: >
      Solo puedo dar las gracias por el trabajo realizado; las palabras para describirlo
      serían profesionalidad, calma (que tanto necesita una pareja ese día), amabilidad y un
      talento natural. Hay muchas formas de ser artista y tú lo eres en tu rama. No tenemos
      palabras para describir lo agradecidos que nos sentimos, y te queremos transmitir, de
      parte de nuestros invitados, su gratitud también, pues tu trato y trabajo no solo fue
      ejemplar con nosotros, sino que todos los invitados quedaron encantados contigo.
      Gracias. Nuestro día perdurará en el tiempo y no solo en nuestros recuerdos gracias a
      tu trabajo.

  - author: "Enrique y Alejandro"
    date: "2017-10-22"
    wedding_date: "2017-10-19"
    rating: 5
    source: "Bodas.net"
    text: >
      Muy profesional: te deja elegir pero también te aconseja. Te hace sentir muy cómodo y
      te hace sacar lo mejor de ti. Elegimos los sitios y él los hizo mágicos. Las sonrisas
      salieron naturales y el amor lo fotografió.
    response: >
      Mil gracias, Enrique y Alejo. Deseo que el amor siga fluyendo entre vosotros el resto
      de vuestras vidas. Gracias por el trato que me habéis dado y la facilidad de trabajar
      para vosotros. Un abrazo.

  - author: "Enrique Fernández Marval"
    date: "2017-10-24"
    wedding_date: "2017-06-09"
    rating: 5
    source: "Bodas.net"
    text: >
      Excelente fotógrafo; lo recomiendo al 1000 %. Desde el momento en que compartió y nos
      dio a conocer su trabajo, la forma de hablar y darse a conocer nos convencieron de que
      era nuestro fotógrafo. El día de la boda fue maravilloso: paciencia en cada pose de las
      fotos y las que captaba de forma imprevista nos cautivaron mucho, ya que están todos
      nuestros detalles de la boda que pensábamos que no quedarían recordados por ser tan
      rápidos. Nuestros familiares quedaron encantados con la atención y la forma tan especial
      de capturar las fotos. La calidad y el precio las maneja de la mano; no me arrepiento de
      contratar a Strada para nuestra boda. Es una excelente persona, a nivel profesional y
      personal, con una calidad humana increíble. De nuevo, recomendado 100 × 100. Si me
      comprometo otra vez —quiera Dios que no—, lo volvería a contratar mil veces. Gracias,
      Mauricio.

  - author: "Gabriela"
    date: "2017-09-26"
    wedding_date: "2017-09-23"
    rating: 5
    source: "Bodas.net"
    text: >
      Para mí, una de las cosas que más nos importaba a mi chico y a mí es que nuestras fotos
      sean reflejo de lo que sintiésemos en nuestra boda, y así fue. Nuestro fotógrafo,
      Mauricio Strada, desde el minuto cero estuvo dándonos información y fue muy paciente,
      ya que no sabíamos cuándo nos confirmaban la hora. En todo momento, atento. Y el día de
      la boda, muy amable, siempre listo para la mejor captura. Sin duda, recomendado cien por
      cien.

  - author: "Lervis Marin"
    date: "2017-08-15"
    wedding_date: "2015-12-12"
    rating: 5
    source: "Bodas.net"
    text: >
      Fue maravilloso poder contar en nuestra boda con el talento y la profesionalidad de
      Mauricio Strada. Sin importar la distancia que nos separaba, el contacto desde el
      primer momento fue increíble: cercano y creativo, y no dudamos en ningún momento en
      contar con sus servicios. Aunque estuviese al otro lado del mundo, valió la pena.
      Nuestros recuerdos plasman lo que queríamos. El trato fue agradable; la puntualidad y el
      saber estar como persona es increíble, y su talento y el resultado de nuestro álbum,
      increíble. Sin lugar a dudas, recomendadísimo. La ecuación entre calidad y precio,
      incomparable.

  - author: "Patricia"
    date: "2016-06-16"
    wedding_date: "2016-04-29"
    rating: 5
    source: "Bodas.net"
    text: >
      El matrimonio es algo muy importante para todas las familias y queremos que ese día tan
      especial sea el más perfecto de todos. Mauricio Strada es un fotógrafo especial que hizo
      que ese día fuera el mejor de todos, con su carisma, su talento, responsabilidad,
      respeto y profesionalidad. A todas las novias que ven esta página les aconsejo que se
      decantan por Mauricio Strada: tendréis vuestros mejores recuerdos con fotos hermosas.
