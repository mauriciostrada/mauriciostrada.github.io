aviso:
  - '"MAURICIO ESTRADA CORTES", im Folgenden das Unternehmen, erbringt Dienstleistungen im Bereich Fotografie. Mit diesem IMPRESSUM soll der Zugang und die Nutzung sowie im Allgemeinen das Verhältnis zwischen diesem Portal (im Folgenden WEBSITE), erreichbar unter mauriciostradaphotography.com, und den Nutzern der WEBSITE (im Folgenden Nutzer) geregelt werden.'
  - Um eine schnelle und wirksame Entwicklung der Beziehung zu den Nutzern zu ermöglichen, garantiert das Unternehmen mit diesem Hinweis die Vertraulichkeit der Online-Dienste gemäß den gesetzlichen Anforderungen und informiert über seine Datenschutzrichtlinie, damit die Nutzer frei und freiwillig entscheiden können, ob sie dem Unternehmen ihre personenbezogenen Daten über das elektronische Formular zur Anmeldung für die auf der WEBSITE angebotenen Dienste zur Verfügung stellen möchten.
  - Die Nutzer willigen in die Verarbeitung dieser personenbezogenen Daten durch das Unternehmen gemäß den Bestimmungen dieser Datenschutzrichtlinie ein.
  - Das Unternehmen garantiert die Vertraulichkeit der von den Nutzern übermittelten personenbezogenen Daten und deren automatisierte Verarbeitung gemäß der geltenden Gesetzgebung zum Schutz personenbezogener Daten sowie aller einschlägigen Vorschriften in diesem Bereich.
cookies:
  - Diese Website verwendet eigene und Drittanbieter-Cookies, um die Navigation zu verbessern, Nutzungsstatistiken zu erheben und gegebenenfalls Werbekampagnen anzuzeigen oder Kommunikation über Chats und andere Tools zu ermöglichen.
  - "Sie können nicht wesentliche Cookies über den Cookie-Hinweis konfigurieren oder ablehnen, der beim Aufruf der Website angezeigt wird. Die verfügbaren Kategorien sind:"
  - "Statistiken"
  - Werbekampagnen
  - Chats und andere Kommunikation
  - Für weitere Informationen über die Verwendung von Cookies kontaktieren Sie uns bitte über das Kontaktformular.
