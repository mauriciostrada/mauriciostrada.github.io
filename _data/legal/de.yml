privacidad:
  - Gemäß den geltenden Datenschutzvorschriften informieren wir Sie, dass die über die Formulare dieser Website übermittelten personenbezogenen Daten von MAURICIO ESTRADA CORTES verarbeitet werden, um Ihre Anfrage zu bearbeiten, die angeforderten Dienstleistungen zu erbringen und Mitteilungen im Zusammenhang mit Ihrer Anfrage zu senden.
  - Rechtsgrundlage der Verarbeitung ist die Einwilligung der betroffenen Person und gegebenenfalls die Erfüllung eines Vertrags oder vorvertraglicher Maßnahmen. Die Daten werden so lange aufbewahrt, wie es zur Erfüllung des Zwecks, für den sie erhoben wurden, und zur Erfüllung möglicher rechtlicher Verpflichtungen erforderlich ist.
  - Sie können Ihre Rechte auf Auskunft, Berichtigung, Löschung, Widerspruch, Einschränkung der Verarbeitung und Datenübertragbarkeit ausüben sowie eine Beschwerde bei der zuständigen Aufsichtsbehörde einreichen, indem Sie an mauriciostradaphotography@gmail.com schreiben.
