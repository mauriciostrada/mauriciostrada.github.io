aviso:
  - '"MAURICIO ESTRADA CORTES", ci-après l''entreprise, fournit des services de photographie. Les présentes MENTIONS LÉGALES ont pour objet de régir l''accès et l''utilisation, et en général la relation entre, ce Portail (ci-après le SITE WEB) accessible à l''adresse mauriciostradaphotography.com, et les utilisateurs du SITE WEB (ci-après les utilisateurs).'
  - Afin de faciliter un développement rapide et efficace de la relation avec les utilisateurs, l''entreprise garantit, au moyen du présent avis, la confidentialité des services en ligne conformément aux exigences légales et informe de sa politique de protection des données à caractère personnel afin que les utilisateurs déterminent librement et volontairement s''ils souhaitent communiquer à l''entreprise leurs données personnelles par le biais du formulaire électronique d''inscription aux services proposés par l''entreprise sur son SITE WEB.
  - Les utilisateurs consentent au traitement de ces données personnelles par l''entreprise aux termes de la présente Politique de protection des données à caractère personnel.
  - L''entreprise garantit la confidentialité des données à caractère personnel fournies par les utilisateurs et leur traitement automatisé conformément à la législation en vigueur en matière de protection des données à caractère personnel, ainsi qu''à l''ensemble de la réglementation applicable en la matière.
cookies:
  - Ce site web utilise des cookies propres et de tiers pour améliorer la navigation, obtenir des statistiques d''utilisation et, le cas échéant, afficher des campagnes commerciales ou permettre des communications via des chats et d''autres outils.
  - "Vous pouvez configurer ou refuser les cookies non essentiels depuis l''avis relatif aux cookies qui s''affiche lors de l''accès au site. Les catégories disponibles sont :"
  - "Statistiques"
  - Campagnes commerciales
  - Chats et autres communications
  - Pour plus d''informations sur l''utilisation des cookies, veuillez nous contacter via le formulaire de contact.
cookies_contact_link: formulaire de contact
privacidad:
  - Conformément à la réglementation en vigueur en matière de protection des données, nous vous informons que les données personnelles fournies via les formulaires de ce site web seront traitées par MAURICIO ESTRADA CORTES aux fins de gérer votre demande, de fournir les services sollicités et d''envoyer des communications liées à votre demande.
  - La base juridique du traitement est le consentement de la personne concernée et, le cas échéant, l''exécution d''un contrat ou de mesures précontractuelles. Les données seront conservées pendant la durée nécessaire à la réalisation de la finalité pour laquelle elles ont été collectées et pour répondre aux éventuelles obligations légales.
  - Vous pouvez exercer vos droits d''accès, de rectification, de suppression, d''opposition, de limitation du traitement et de portabilité, ainsi que déposer une réclamation auprès de l''autorité de contrôle compétente, en écrivant à mauriciostradaphotography@gmail.com.
