privacidad:
  - De conformidad con la normativa vigente en materia de protección de datos, le informamos que los datos personales facilitados a través de los formularios de este sitio web serán tratados por MAURICIO ESTRADA CORTES con la finalidad de gestionar su consulta, la prestación de los servicios solicitados y el envío de comunicaciones relacionadas con su solicitud.
  - La base legal del tratamiento es el consentimiento del interesado y, en su caso, la ejecución de un contrato o medidas precontractuales. Los datos se conservarán durante el tiempo necesario para cumplir la finalidad para la que se recabaron y para atender posibles responsabilidades legales.
  - Puede ejercer sus derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad, así como presentar una reclamación ante la autoridad de control competente, escribiendo a mauriciostradaphotography@gmail.com.
