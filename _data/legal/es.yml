aviso:
  - '"MAURICIO ESTRADA CORTES", en adelante la empresa, se dedica a la prestación de servicios de fotografía. A través de este AVISO LEGAL se pretende regular el acceso y uso, y en general, la relación entre este Portal (en adelante WEBSITE) accesible en la dirección de Internet mauriciostradaphotography.com, y los usuarios del WEBSITE (en adelante usuarios).'
  - Con el fin de facilitar un desarrollo rápido y eficaz de la relación con los usuarios, la empresa garantiza mediante este aviso la privacidad de los servicios online de acuerdo con las exigencias legales e informa acerca de su política de protección de datos de carácter personal para que los usuarios determinen libre y voluntariamente si desean facilitar a la empresa sus datos personales a través del formulario electrónico para la suscripción de los servicios ofrecidos por la empresa en su WEBSITE.
  - Los usuarios consienten el tratamiento de dichos datos personales por la empresa en los términos de la presente Política de Protección de Datos de Carácter Personal.
  - La empresa garantiza la confidencialidad de los datos de carácter personal facilitados por los usuarios y su tratamiento automatizado de acuerdo a la legislación vigente sobre protección de datos de carácter personal, así como toda la normativa aplicable a esta materia.
cookies:
  - Este sitio web utiliza cookies propias y de terceros para mejorar la navegación, obtener estadísticas de uso y, en su caso, mostrar campañas comerciales o permitir comunicaciones a través de chats y otras herramientas.
  - "Puede configurar o rechazar las cookies no esenciales desde el aviso de cookies que aparece al acceder al sitio. Las categorías disponibles son:"
  - "Estadísticas"
  - Campañas comerciales
  - Chats y otras comunicaciones
  - Para más información sobre el uso de cookies, contacte con nosotros a través del formulario de contacto.
