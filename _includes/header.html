<header class="site-header" id="site-header">
  <div class="header-inner">
    <div class="header-logo">
      <a href="{{ '/' | lang_url | relative_url }}" aria-label="{{ site.title }}">
        <img src="{{ '/assets/images/logo.webp' | relative_url }}" alt="{{ site.title }}" class="site-logo" loading="lazy" decoding="async">
      </a>
    </div>

    <button class="menu-toggle" id="menu-toggle" aria-label="{{ t.ui.menu_open }}" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="header-tools desktop-only">
      {% include language-selector.html %}
    </div>
  </div>

  <nav class="site-nav" id="site-nav" role="navigation" aria-label="{{ t.ui.main_nav }}">
    <ul class="nav-list">
      {% for item in site.data.routes.nav %}
        {% assign nav_title = t.nav[item.key] %}
        <li class="nav-item{% if page.url contains item.path %} active{% endif %}">
          <a href="{{ item.path | lang_url | relative_url }}" class="nav-link">{{ nav_title }}</a>
        </li>
      {% endfor %}
    </ul>
    <div class="nav-extras mobile-only">
      {% include language-selector.html %}
      {% include social-icons.html %}
      {% include contact-icons.html %}
    </div>
  </nav>
</header>
<div class="header-spacer" id="header-spacer"></div>
