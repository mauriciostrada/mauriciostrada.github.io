{% assign gallery_folder = include.folder | default: page.gallery_folder %}
{% assign images = site.data.gallery_catalog[gallery_folder] %}

{% if images == nil or images.size == 0 %}
  <p class="gallery-empty">{{ t.gallery_ui.empty }}</p>
{% else %}
  <div class="gallery-grid" data-gallery-grid>
    {% for image in images %}
      <button
        type="button"
        class="gallery-item"
        data-gallery-index="{{ forloop.index0 }}"
        aria-label="{{ t.gallery_ui.view_image }} {{ forloop.index }} {{ t.gallery_ui.of }} {{ images.size }}"
      >
        <img
          class="gallery-lazy-img"
          {% unless image.width and image.height %}
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
          {% endunless %}
          data-src="{{ image.path | relative_url }}"
          alt="{{ image.alt | escape }}"
          {% if image.width and image.height %}
          width="{{ image.width }}"
          height="{{ image.height }}"
          style="aspect-ratio: {{ image.width }} / {{ image.height }};"
          {% endif %}
          decoding="async"
        >
      </button>
    {% endfor %}
  </div>

  <div class="gallery-lightbox" id="gallery-lightbox" hidden aria-hidden="true">
    <button type="button" class="gallery-lightbox-close" data-gallery-close aria-label="{{ t.ui.close }}">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button type="button" class="gallery-lightbox-nav gallery-lightbox-prev" data-gallery-prev aria-label="{{ t.ui.previous }}">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button type="button" class="gallery-lightbox-nav gallery-lightbox-next" data-gallery-next aria-label="{{ t.ui.next }}">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <div class="gallery-lightbox-stage">
      <img src="" alt="" id="gallery-lightbox-image">
    </div>
    <p class="gallery-lightbox-counter" id="gallery-lightbox-counter"></p>
  </div>

  <script type="application/json" id="gallery-lightbox-data">[
    {%- for image in images -%}
      {"path":{{ image.path | relative_url | jsonify }},"alt":{{ image.alt | jsonify }}}{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  ]</script>
{% endif %}
