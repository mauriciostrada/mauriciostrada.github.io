<section class="slideshow" id="slideshow" data-interval="{{ site.data.web-slideshow.interval | default: 4000 }}" aria-label="Presentación fotográfica">
  {% for image in site.data.web-slideshow.images %}
    <div class="slideshow-slide{% if forloop.first %} is-active{% endif %}">
      <img
        src="{{ image.file | relative_url }}"
        alt="{{ image.alt | default: image.title }}"
        {% if forloop.first %}loading="eager"{% else %}loading="lazy"{% endif %}
      >
    </div>
  {% endfor %}
</section>
