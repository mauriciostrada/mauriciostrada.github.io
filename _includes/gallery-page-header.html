<header class="gallery-header">
  <h1 class="section-title section-title--compact">{{ gallery_t.title | default: page.title }}</h1>
  {% assign gallery_desc = gallery_t.description %}
  {% if gallery_desc %}
    <p class="gallery-description">{{ gallery_desc }}</p>
  {% elsif page.description %}
    <p class="gallery-description">{{ page.description }}</p>
  {% endif %}
</header>
