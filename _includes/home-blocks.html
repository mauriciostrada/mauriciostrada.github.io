<div class="home-blocks">
  {% for block in site.data.home-blocks %}
    {% assign block_t = t.home_blocks[block.key] %}
    <div class="home-block">
      <a href="{% if block.external %}{{ block.url }}{% else %}{{ block.url | lang_url | relative_url }}{% endif %}"
         class="home-block-link"
         {% if block.external %}target="_blank" rel="noopener"{% endif %}>
        <img src="{{ block.image | relative_url }}" alt="{{ block_t.alt }}" class="home-block-image" loading="lazy" decoding="async">
        <div class="home-block-title">{{ block_t.title }}</div>
      </a>
    </div>
  {% endfor %}
</div>
