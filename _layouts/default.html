<!DOCTYPE html>
<html lang="{{ site.lang }}">
  {% include head.html %}
  <body class="{{ page.body_class | default: layout.body_class }}">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    {% include page-background.html %}

    <div class="page-wrapper">
      {% include header.html %}

      <main id="main-content" class="main-content">
        {{ content }}
      </main>

      {% unless page.hide_footer %}
        {% include footer.html %}
      {% endunless %}
    </div>

    {% include legal-modal.html %}

    <button class="go-top" id="go-top" aria-label="Volver arriba" hidden>
      <i class="fa-solid fa-angle-up"></i>
    </button>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/legal-modal.js' | relative_url }}" defer></script>
    {% include defer-scripts.html %}
  </body>
</html>
