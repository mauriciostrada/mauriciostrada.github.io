<!DOCTYPE html>
{% include i18n-init.html %}
<html lang="{{ site.lang | default: 'es' }}">
  {% include head.html %}
  <body
    class="{{ page.body_class | default: layout.body_class }}"
    data-spam-error-contact="{{ t.forms.contact.spam_error | xml_escape }}"
    data-spam-error-reviews="{{ t.forms.reviews.spam_error | xml_escape }}"
    data-menu-open="{{ t.ui.menu_open | xml_escape }}"
    data-menu-close="{{ t.ui.menu_close | xml_escape }}"
  >
    <a href="#main-content" class="skip-link">{{ t.ui.skip_link }}</a>

    {% include page-background.html %}

    <div class="page-wrapper">
      {% include header.html %}

      <main id="main-content" class="main-content">
        {{ content }}
      </main>

      {% unless page.hide_footer %}
        {% include footer.html %}
      {% endunless %}
    </div>

    {% include legal-modal.html %}

    <button class="go-top" id="go-top" aria-label="{{ t.ui.go_top }}" hidden>
      <i class="fa-solid fa-angle-up"></i>
    </button>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/legal-modal.js' | relative_url }}" defer></script>
    {% include defer-scripts.html %}
  </body>
</html>
