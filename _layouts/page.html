---
layout: default
---

<section class="panel-page{% if page.panel_narrow %} panel-page--narrow{% endif %}">
  <div class="panel-page__inner">
    {% if page.title %}
      <h1 class="section-title">{{ page.title }}</h1>
    {% endif %}
    <div class="panel-page__content">
      {{ content }}
    </div>
  </div>
</section>
