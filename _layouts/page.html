---
layout: default
---

<section class="page-section{% if page.section_class %} {{ page.section_class }}{% endif %}">
  <div class="page-container">
    {% if page.title %}
      <h1 class="page-title">{{ page.title }}</h1>
    {% endif %}
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</section>
